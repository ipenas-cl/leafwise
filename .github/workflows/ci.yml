name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Test (with Postgres integration)
        env:
          LEAFWISE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./cmd/leafwise

  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ml/serve/requirements.txt pytest
      - name: Model regression tests on sample leaves
        run: cd ml/serve && pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, inference, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
      - name: Smoke test the full stack
        run: |
          docker compose up -d
          for i in $(seq 1 60); do curl -fs localhost:8080/readyz && break; sleep 2; done
          curl -fs localhost:8080/api/plants | grep -q nickname
          curl -fs -F photo=@ml/samples/Early_blight-1.jpg \
            "localhost:8080/api/plants/$(curl -fs localhost:8080/api/plants | jq -r '.[0].id')/diagnoses" | tee /dev/stderr | grep -q "Early blight"
          curl -fs localhost:3000/ | grep -q Leafwise
      - if: always()
        run: docker compose logs --no-color | tail -200
